name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: dev, POSTGRES_DB: resilio_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:dev@localhost:5432/resilio_test
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/resilio_test
      SECRET_KEY: ci
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: back/requirements.txt}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      # las migraciones deben aplicar y coincidir con los modelos
      - run: flask --app app db upgrade && flask --app app db check
