<!DOCTYPE html>
<html lang="{{ get_locale() }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Resilio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    {% block head_css %}{% endblock %}
    {% block head_scripts %}{% endblock %}
    <script>
        // Aplicar tema ANTES de que cargue el body para evitar parpadeo
        (function() {
            const savedTheme = localStorage.getItem('resilio-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    {% block head_end %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}
</body>

</html>
