<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilio | Restablecer Contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script>
        // Aplicar tema antes de cargar
        (function() {
            const savedTheme = localStorage.getItem('resilio-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
</head>

<body class="auth-page">
    <aside class="auth-brand" aria-hidden="true">
        <span class="brand-mark">Resilio</span>
        <div class="brand-word">Resilio</div>
        <div class="brand-foot">BAT-12 · Burnout Assessment Tool</div>
    </aside>
    <main class="auth-main">
        <div class="language-switcher" role="group" aria-label="Idioma">
            <button type="button" class="language-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
            <button type="button" class="language-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
            <button type="button" class="language-btn" data-lang="ca" onclick="setLanguage('ca')">CA</button>
        </div>
    <div class="login-wrapper">
        <div class="login-card">
            <header class="logo-container">
                <p class="tagline" data-i18n="restablecerContrasena">Restablecer Contraseña</p>
            </header>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/reset_password/{{ token }}" method="POST" class="login-form">
                <div class="input-field">
                    <label for="reset_password-password" data-i18n="nuevaContrasena">Nueva Contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <input id="reset_password-password" autocomplete="new-password" type="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="input-field">
                    <label for="reset_password-confirm_password" data-i18n="confirmarContrasena">Confirmar Nueva Contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <input id="reset_password-confirm_password" autocomplete="new-password" type="password" name="confirm_password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" data-i18n="guardarContrasena">Guardar Contraseña</button>
            </form>
        </div>
    </div>
    </main>

    <script>
        // Textos de esta página (el motor está en static/js/i18n.js)
        Resilio.i18n.add({
            "es": {
                "restablecerContrasena": "Restablecer Contraseña",
                "nuevaContrasena": "Nueva Contraseña",
                "confirmarContrasena": "Confirmar Nueva Contraseña",
                "guardarContrasena": "Guardar Contraseña"
            },
            "en": {
                "restablecerContrasena": "Reset Password",
                "nuevaContrasena": "New Password",
                "confirmarContrasena": "Confirm New Password",
                "guardarContrasena": "Save Password"
            },
            "ca": {
                "restablecerContrasena": "Restablir Contrasenya",
                "nuevaContrasena": "Nova Contrasenya",
                "confirmarContrasena": "Confirmar Nova Contrasenya",
                "guardarContrasena": "Desar Contrasenya"
            }
        });
    </script>
</body>

</html>
