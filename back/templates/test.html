<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilio - Test BAT-12</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script>
        // Aplicar tema antes de cargar
        (function() {
            const savedTheme = localStorage.getItem('resilio-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        body.test-page {
            display: block;
            padding: clamp(24px, 5vw, 64px) 20px 80px;
        }

        .test-container { max-width: 760px; margin: 0 auto; }

        .test-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: clamp(32px, 6vw, 64px);
        }

        .test-top .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.04em;
            color: var(--ink);
            text-decoration: none;
        }
        .test-top .brand::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

        .test-header { margin-bottom: 36px; }

        .test-header h1 {
            font-size: var(--t6);
            letter-spacing: -0.05em;
            line-height: 0.95;
            margin-bottom: 14px;
        }

        .test-header p { color: var(--muted); font-size: var(--t2); font-family: var(--font-display); letter-spacing: -0.02em; }

        .info-box {
            background: var(--fill-1);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 20px 22px;
            margin-bottom: 28px;
            box-shadow: inset 3px 0 0 var(--accent);
        }
        .info-box h3 { font-family: var(--font-text); font-size: 0.95rem; margin-bottom: 6px; letter-spacing: 0; }
        .info-box h3 i { color: var(--accent-ink); margin-right: 8px; }
        .info-box p { color: var(--muted); font-size: 0.92rem; }
        .info-box p strong { color: var(--ink); font-weight: 600; }

        /* Progreso fijo arriba mientras se responde */
        .progress-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            margin: 0 -20px 28px;
            padding: 14px 20px;
            background: color-mix(in srgb, var(--ground) 88%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        .progress-bar .progress-label {
            display: flex;
            justify-content: space-between;
            margin: 0 auto 8px;
            max-width: 760px;
            font-size: 0.82rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .progress-bar .progress-track { max-width: 760px; margin: 0 auto; }
        .progress-bar .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.5s var(--ease);
        }

        .question-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: clamp(22px, 4vw, 34px);
            margin-bottom: 18px;
            transition: border-color 0.3s var(--ease);
        }
        .question-card:focus-within { border-color: var(--fill-3); }
        .question-card.answered { border-color: var(--accent-dim); }

        .question-number {
            display: block;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 14px;
            font-variant-numeric: tabular-nums;
        }

        .question-text {
            font-family: var(--font-display);
            font-size: clamp(1.2rem, 1.05rem + 0.8vw, 1.55rem);
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.25;
            margin-bottom: 26px;
            max-width: 36ch;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .option-label {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Radio oculto pero enfocable (teclado y validación nativa siguen funcionando) */
        .option-label input {
            position: absolute;
            inset: 0 0 auto 0;
            height: 52px;
            width: 100%;
            opacity: 0;
            cursor: pointer;
            margin: 0;
        }

        .option-circle {
            width: 100%;
            max-width: 64px;
            aspect-ratio: 1;
            border-radius: var(--r-sm);
            background: var(--fill-1);
            border: 1px solid var(--input-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--muted);
            transition: background 0.3s var(--ease), border-color 0.3s var(--ease), color 0.3s var(--ease), transform 0.35s var(--ease);
        }

        .option-label:hover .option-circle { border-color: var(--accent-ink); color: var(--ink); transform: scale(1.04); }

        .option-label input:checked + .option-circle {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
            transform: scale(1.04);
        }

        .option-label input:focus-visible + .option-circle {
            outline: 2px solid var(--accent-ink);
            outline-offset: 3px;
        }

        .option-text {
            font-size: 0.72rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.2;
        }
        .option-label input:checked ~ .option-text { color: var(--accent-ink); font-weight: 600; }

        .scale-legend { display: none; } /* las etiquetas ya van bajo cada opción */

        .btn-test {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 20px;
            background: var(--accent);
            border: 0;
            border-radius: var(--r);
            color: var(--on-accent);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
            margin-top: 28px;
            transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
        }
        .btn-test:hover { transform: scale(1.01); box-shadow: 0 0 0 6px var(--accent-dim); }
        .btn-test:active { transform: scale(0.99); }
        .btn-test:disabled { opacity: 0.7; cursor: progress; }

        @media (max-width: 520px) {
            .options-grid { gap: 6px; }
            .option-text { font-size: 0.66rem; }
        }
    .paso-acciones { display: flex; gap: 12px; justify-content: space-between; margin-top: 20px; flex-wrap: wrap; }
    .btn-back { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: var(--r-sm);
                padding: 10px 16px; cursor: pointer; font: inherit; }
    .btn-back:hover { border-color: var(--accent); }
    </style>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
</head>

<body class="test-page" hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
    
    <div class="test-container">
        
        <div class="test-top">
            <a class="brand" href="/dashboard">Resilio</a>
            <div class="language-switcher" role="group" aria-label="Idioma">
                <button type="button" class="language-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
                <button type="button" class="language-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
                <button type="button" class="language-btn" data-lang="ca" onclick="setLanguage('ca')">CA</button>
            </div>
        </div>

        <div class="test-header">
            <h1 data-i18n="testBat12">Test BAT-12</h1>
            <p data-i18n="evaluacionAgotamiento">Evaluación de Agotamiento Laboral</p>
        </div>

        <div class="info-box">
            <h3><i class="fas fa-info-circle" aria-hidden="true"></i><span data-i18n="comoResponder">Como responder?</span></h3>
            <p data-i18n="instruccionesTest">Responde cada pregunta pensando en <strong>como te has sentido en las ultimas semanas</strong>. 
            La escala va de 1 (Nunca) a 5 (Siempre). No hay respuestas correctas o incorrectas.</p>
        </div>
        
        <p id="nota-traduccion" data-i18n="traduccionNoValidada" hidden style="color: var(--muted); font-size: 0.85rem; margin: 12px 0;"></p>
        <div id="paso" aria-live="polite">
            {% include "_test_paso.html" %}
        </div>
        
    </div>
    
    <script>
        // Textos de esta página (el motor está en static/js/i18n.js)
        Resilio.i18n.add({
            "es": {
                "testBat12": "Test BAT-12",
                "evaluacionAgotamiento": "Evaluación de Agotamiento Laboral",
                "comoResponder": "Como responder?",
                "instruccionesTest": "Responde cada pregunta pensando en como te has sentido en las ultimas semanas. La escala va de 1 (Nunca) a 5 (Siempre). No hay respuestas correctas o incorrectas.",
                "progreso": "Progreso",
                "enviarRespuestas": "Enviar Respuestas",
                "pregunta": "Pregunta",
                "de": "de",
                "nunca": "Nunca",
                "raramente": "Raramente",
                "aVeces": "A veces",
                "aMenudo": "A menudo",
                "siempre": "Siempre",
                "atras": "Atrás",
                "siguiente": "Siguiente",
                "listoEnviar": "Has respondido todas las preguntas.",
                "faltanRespuestas": "Aún te quedan preguntas por responder."
            },
            "en": {
                "testBat12": "BAT-12 Test",
                "evaluacionAgotamiento": "Workplace Burnout Assessment",
                "comoResponder": "How to answer?",
                "instruccionesTest": "Answer each question thinking about how you have felt in the last few weeks. The scale goes from 1 (Never) to 5 (Always). There are no right or wrong answers.",
                "progreso": "Progress",
                "enviarRespuestas": "Submit Answers",
                "pregunta": "Question",
                "de": "of",
                "nunca": "Never",
                "raramente": "Rarely",
                "aVeces": "Sometimes",
                "aMenudo": "Often",
                "siempre": "Always",
                "atras": "Back",
                "siguiente": "Next",
                "listoEnviar": "You have answered all the questions.",
                "faltanRespuestas": "You still have unanswered questions.",
                "traduccionNoValidada": "These questions are an unofficial, non-validated translation of the BAT-12."
            },
            "ca": {
                "testBat12": "Test BAT-12",
                "evaluacionAgotamiento": "Avaluació d'Esgotament Laboral",
                "comoResponder": "Com respondre?",
                "instruccionesTest": "Respon a cada pregunta pensant com t'has sentit les últimes setmanes. L'escala va de 1 (Mai) a 5 (Sempre). No hi ha respostes correctes o incorrectes.",
                "progreso": "Progrés",
                "enviarRespuestas": "Enviar Respostes",
                "pregunta": "Pregunta",
                "de": "de",
                "nunca": "Mai",
                "raramente": "Rarament",
                "aVeces": "A vegades",
                "aMenudo": "Sovint",
                "siempre": "Sempre",
                "atras": "Enrere",
                "siguiente": "Següent",
                "listoEnviar": "Has respost totes les preguntes.",
                "faltanRespuestas": "Encara et queden preguntes per respondre.",
                "traduccionNoValidada": "Aquestes preguntes són una traducció no oficial i no validada del BAT-12."
            }
        });

        // Preguntas en es/en/ca (vienen de la BD)
        Resilio.i18n.add({{ i18n_preguntas|tojson }});
        // El idioma elegido viaja con el formulario (idioma de los consejos) y las traducciones se avisan
        Resilio.i18n.onApply(function (lang) {
            var campo = document.getElementById('lang-field');
            if (campo) campo.value = lang;
            document.getElementById('nota-traduccion').hidden = (lang === 'es');
        });

        // Al cambiar de pantalla (HTMX) se vuelven a aplicar las traducciones y el idioma del formulario
        function idiomaActual() {
            try { return localStorage.getItem('resilio-language') || 'es'; } catch (e) { return 'es'; }
        }
        document.addEventListener('htmx:afterSwap', function () { Resilio.i18n.apply(idiomaActual()); });
    </script>
</body>

</html>
